<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro→Matches 04 — Perspective Morph</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
<style>.font-serif{font-family:'Cormorant Garamond',serif}</style>
</head>
<body class="bg-[#0c0205] overflow-x-hidden antialiased" style="perspective:1200px">
<div class="fixed top-0 inset-x-0 z-50 bg-black/60 backdrop-blur border-b border-white/10">
  <div class="max-w-[1600px] mx-auto px-6 h-[48px] flex items-center justify-between text-[11px] tracking-[0.16em] uppercase text-white/50">04 — Perspective Morph <b class="text-[#e3c877]">IMMERSIVE</b><span class="hidden md:inline text-white/30">Intro rotateX • Matches morph radius</span></div>
</div>
<section id="intro-persp" class="relative py-16 lg:py-24 flex flex-col justify-center overflow-hidden will-change-transform" style="background: linear-gradient(135deg, #3a0c15 0%, #6e2a2a 48%, #f6e6b4 100%); will-change:transform; transform-origin:center top; min-height:86vh;">
  <div id="intro-persp-content" class="relative max-w-[1600px] mx-auto px-6 lg:px-10 grid lg:grid-cols-12 gap-8 items-center w-full">
    <div class="lg:col-span-5"><div class="aspect-[4/5] bg-white/10 border border-white/15"></div></div>
    <div class="lg:col-span-6 lg:col-start-7"><h2 class="font-serif text-[44px] font-light text-[#3a0c15]">Your Best Life</h2></div>
  </div>
</section>
<section id="matches-persp" class="relative min-h-screen flex flex-col justify-center py-16 overflow-hidden will-change-transform" style="background: linear-gradient(135deg, #3a0c15 0%, #8a4a2f 64%, #f6e6b4 100%); will-change:transform; margin-top:-40px; border-top-left-radius:48px; border-top-right-radius:48px; box-shadow:0 -24px 60px rgba(0,0,0,0.4)">
  <div class="max-w-6xl mx-auto px-6 w-full"><h2 class="font-serif text-[38px] font-bold">Meet Profiles That Could Be<br><span class="bg-gradient-to-r from-[#f6e6b4] to-[#dcb04a] bg-clip-text text-transparent italic">Your Perfect Match.</span></h2></div>
</section>
<div class="h-[60vh] bg-[#FFFBF0] grid place-items-center text-[#3a0c15]/30 text-xs tracking-widest uppercase">Perspective ends</div>
<script>
gsap.registerPlugin(ScrollTrigger);
const lenis=new Lenis({duration:1.2, lerp:0.1, smoothWheel:true, easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))});
lenis.on('scroll', ScrollTrigger.update); function raf(t){lenis.raf(t); requestAnimationFrame(raf);} requestAnimationFrame(raf);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  gsap.to("#intro-persp",{ scale:0.93, rotationX:5, yPercent:-5, transformOrigin:"center top", ease:"none", scrollTrigger:{trigger:"#intro-persp", start:"top top", end:"bottom top", scrub:0.9 }});
  gsap.to("#intro-persp-content",{ y:-50, opacity:0, scrollTrigger:{trigger:"#intro-persp", start:"top top", end:"60% top", scrub:0.8 }});
  gsap.fromTo("#matches-persp",{ y:100, borderTopLeftRadius:"48px", borderTopRightRadius:"48px" },{ y:0, borderTopLeftRadius:"0px", borderTopRightRadius:"0px", ease:"none", scrollTrigger:{trigger:"#matches-persp", start:"top bottom", end:"top 20%", scrub:0.9 }});
}
</script>
</body>
</html>
