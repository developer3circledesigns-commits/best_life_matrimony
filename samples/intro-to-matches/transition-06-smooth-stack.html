<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro→Matches 06 — Smooth Stack</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
<style>.font-serif{font-family:'Cormorant Garamond',serif}</style>
</head>
<body class="bg-[#0c0205] overflow-x-hidden antialiased">
<div class="fixed top-0 inset-x-0 z-50 bg-[#0c0205]/70 backdrop-blur border-b border-white/10">
  <div class="max-w-[1600px] mx-auto px-6 h-[48px] flex items-center justify-between text-[11px] tracking-[0.16em] uppercase text-white/50">06 — Smooth Stack <b class="text-[#e3c877]">LIGHTEST • NO PIN</b><span class="hidden md:inline text-white/30">Rounded overlap only • 60fps</span></div>
</div>
<section id="intro-smooth" class="relative py-16 lg:py-24 flex flex-col justify-center overflow-hidden" style="background: linear-gradient(135deg, #3a0c15 0%, #6e2a2a 48%, #f6e6b4 100%); min-height:86vh;">
  <div id="intro-smooth-content" class="relative max-w-[1600px] mx-auto px-6 lg:px-10 grid lg:grid-cols-12 gap-8 items-center w-full will-change-transform" style="will-change:transform,opacity">
    <div class="lg:col-span-5"><div class="aspect-[4/5] bg-white/10 border border-white/15"></div></div>
    <div class="lg:col-span-6 lg:col-start-7"><h2 class="font-serif text-[44px] font-light text-[#3a0c15]">Your Best Life</h2></div>
  </div>
</section>
<section id="matches-smooth" class="relative min-h-screen flex flex-col justify-center py-16 overflow-hidden will-change-transform" style="background: linear-gradient(135deg, #3a0c15 0%, #8a4a2f 64%, #f6e6b4 100%); will-change:transform; margin-top:-40px; border-top-left-radius:40px; border-top-right-radius:40px; box-shadow:0 -16px 48px rgba(0,0,0,0.32)">
  <div class="max-w-6xl mx-auto px-6 w-full"><h2 class="font-serif text-[38px] font-bold">Meet Profiles That Could Be<br><span class="bg-gradient-to-r from-[#f6e6b4] to-[#dcb04a] bg-clip-text text-transparent italic">Your Perfect Match.</span></h2></div>
</section>
<div class="h-[60vh] bg-[#FFFBF0] grid place-items-center text-[#3a0c15]/30 text-xs tracking-widest uppercase">Smooth ends</div>
<script>
gsap.registerPlugin(ScrollTrigger);
const lenis=new Lenis({duration:1.2, lerp:0.1, smoothWheel:true, easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))});
lenis.on('scroll', ScrollTrigger.update); function raf(t){lenis.raf(t); requestAnimationFrame(raf);} requestAnimationFrame(raf);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  gsap.to("#intro-smooth-content",{ y:-40, opacity:0, scrollTrigger:{trigger:"#intro-smooth", start:"top top", end:"55% top", scrub:0.85 }});
}
</script>
</body>
</html>
