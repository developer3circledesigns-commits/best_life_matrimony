<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro→Matches 03 — Clip Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
<style>.font-serif{font-family:'Cormorant Garamond',serif}</style>
</head>
<body class="bg-[#0c0205] overflow-x-hidden antialiased">
<div class="fixed top-0 inset-x-0 z-50 bg-black/60 backdrop-blur border-b border-white/10">
  <div class="max-w-[1600px] mx-auto px-6 h-[48px] flex items-center justify-between text-[11px] tracking-[0.16em] uppercase text-white/50">03 — Clip Reveal <b class="text-[#e3c877]">EDITORIAL INSET</b><span class="hidden md:inline text-white/30">Intro clip inset • Matches wipe</span></div>
</div>
<section id="intro-clip" class="relative py-16 lg:py-24 flex flex-col justify-center overflow-hidden will-change-transform" style="background: linear-gradient(135deg, #3a0c15 0%, #6e2a2a 48%, #f6e6b4 100%); will-change:clip-path; clip-path:inset(0 0 0 0); min-height:86vh;">
  <div id="intro-clip-content" class="relative max-w-[1600px] mx-auto px-6 lg:px-10 grid lg:grid-cols-12 gap-8 items-center w-full will-change-transform" style="will-change:transform,opacity">
    <div class="lg:col-span-5"><div class="aspect-[4/5] overflow-hidden border border-white/15"><img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=900&q=80&auto=format&fit=crop" class="h-full w-full object-cover"></div></div>
    <div class="lg:col-span-6 lg:col-start-7"><h2 class="font-serif text-[44px] font-light leading-[0.9] text-[#3a0c15]">Your Best Life<br>One Connection.</h2></div>
  </div>
</section>
<section id="matches-clip" class="relative min-h-screen flex flex-col justify-center py-16 overflow-hidden" style="background: linear-gradient(135deg, #3a0c15 0%, #8a4a2f 64%, #f6e6b4 100%);">
  <div class="relative max-w-6xl mx-auto px-6 w-full">
    <h2 class="font-serif text-[38px] font-bold">Meet Profiles That Could Be<br><span class="bg-gradient-to-r from-[#f6e6b4] to-[#dcb04a] bg-clip-text text-transparent italic">Your Perfect Match.</span></h2>
    <div class="mt-8 grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
      <div class="rounded-xl border border-white/10 bg-white/5 p-5">01 — Age & Location</div>
      <div class="rounded-xl border border-white/10 bg-white/5 p-5">02 — Education</div>
      <div class="rounded-xl border border-white/10 bg-white/5 p-5">03 — Family</div>
      <div class="rounded-xl border bg-[#f6e6b4] p-5 text-[#3a0c15]">04 — Preferences</div>
    </div>
  </div>
</section>
<div class="h-[60vh] bg-[#FFFBF0] grid place-items-center text-[#3a0c15]/30 text-xs tracking-widest uppercase">Clip ends</div>
<script>
gsap.registerPlugin(ScrollTrigger);
const lenis=new Lenis({duration:1.2, lerp:0.1, smoothWheel:true, easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))});
lenis.on('scroll', ScrollTrigger.update); function raf(t){lenis.raf(t); requestAnimationFrame(raf);} requestAnimationFrame(raf);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  gsap.to("#intro-clip",{ clipPath:"inset(0 0 22% 0)", ease:"none", scrollTrigger:{trigger:"#intro-clip", start:"top top", end:"bottom top", scrub:0.9 }});
  gsap.to("#intro-clip-content",{ y:-40, opacity:0, ease:"none", scrollTrigger:{trigger:"#intro-clip", start:"top top", end:"60% top", scrub:0.8 }});
}
</script>
</body>
</html>
