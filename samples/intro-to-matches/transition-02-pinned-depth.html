<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro→Matches 02 — Pinned Depth</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
<style>.font-serif{font-family:'Cormorant Garamond',serif}</style>
</head>
<body class="bg-[#0c0205] overflow-x-hidden antialiased">
<div class="fixed top-0 inset-x-0 z-50 bg-black/60 backdrop-blur border-b border-white/10">
  <div class="max-w-[1600px] mx-auto px-6 h-[48px] flex items-center justify-between text-[11px] tracking-[0.16em] uppercase text-white/50">02 — Pinned Depth <b class="text-[#e3c877]">APPLE STACK</b><span class="hidden md:inline text-white/30">Intro pinned 90vh • Matches slides over</span></div>
</div>
<section id="intro-pin" class="relative py-16 lg:py-24 overflow-hidden flex flex-col justify-center" style="background: linear-gradient(135deg, #3a0c15 0%, #6e2a2a 48%, #f6e6b4 100%); min-height:86vh;">
  <div id="intro-content-pin" class="relative max-w-[1600px] mx-auto px-6 lg:px-10 grid lg:grid-cols-12 gap-8 items-center w-full will-change-transform" style="will-change:transform,opacity">
    <div class="lg:col-span-5"><div class="aspect-[4/5] overflow-hidden border border-white/15"><img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=900&q=80&auto=format&fit=crop" class="h-full w-full object-cover"></div></div>
    <div class="lg:col-span-6 lg:col-start-7"><h2 class="font-serif text-[44px] lg:text-[58px] font-light leading-[0.9] text-[#3a0c15]">Your Best Life<br>Could Begin With<br><span class="italic text-[#5a1a1a]">One Connection.</span></h2><p class="mt-4 text-[#3a0c15]/70 text-sm leading-7">Intro content — parallax during pin.</p></div>
  </div>
</section>
<section id="matches-pin" class="relative min-h-screen flex flex-col justify-center py-16 lg:py-20 overflow-hidden will-change-transform" style="background: linear-gradient(135deg, #3a0c15 0%, #5e1e2e 32%, #8a4a2f 64%, #f6e6b4 100%); will-change:transform; margin-top:-40px; border-top-left-radius:40px; border-top-right-radius:40px; box-shadow:0 -20px 60px rgba(0,0,0,0.35)">
  <div class="relative max-w-6xl mx-auto px-6 w-full">
    <h2 class="font-serif text-[38px] lg:text-[46px] font-bold leading-[0.9]">Meet Profiles That Could Be<br><span class="bg-gradient-to-r from-[#f6e6b4] to-[#dcb04a] bg-clip-text text-transparent italic">Your Perfect Match.</span></h2>
    <div class="mt-8 grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
      <div class="rounded-[18px] border border-white/10 bg-white/[0.04] p-6"><p class="text-xs text-[#e3c877] font-bold">01 — Age & Location</p></div>
      <div class="rounded-[18px] border border-white/10 bg-white/[0.04] p-6"><p class="text-xs text-[#e3c877] font-bold">02 — Education</p></div>
      <div class="rounded-[18px] border border-white/10 bg-white/[0.04] p-6"><p class="text-xs text-[#e3c877] font-bold">03 — Family</p></div>
      <div class="rounded-[18px] border border-[#f6e6b4]/20 bg-[#f6e6b4] p-6"><p class="text-xs text-[#3a0c15] font-bold">04 — Preferences</p></div>
    </div>
  </div>
</section>
<div class="h-[70vh] bg-[#FFFBF0] grid place-items-center text-[#3a0c15]/30 text-xs tracking-widest uppercase">Next — pinned ends</div>
<script>
gsap.registerPlugin(ScrollTrigger);
const lenis=new Lenis({duration:1.2, lerp:0.1, smoothWheel:true, easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))});
lenis.on('scroll', ScrollTrigger.update); function raf(t){lenis.raf(t); requestAnimationFrame(raf);} requestAnimationFrame(raf);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  ScrollTrigger.create({ trigger:"#intro-pin", start:"top top", end:"+=85%", pin:true, pinSpacing:false, anticipatePin:1 });
  gsap.to("#intro-content-pin",{ y:-60, opacity:0, scale:0.97, ease:"none", scrollTrigger:{trigger:"#intro-pin", start:"top top", end:"+=85%", scrub:0.9 }});
  gsap.fromTo("#matches-pin",{ y:80, scale:0.96 },{ y:0, scale:1, ease:"none", scrollTrigger:{trigger:"#matches-pin", start:"top bottom", end:"top top", scrub:0.9 }});
}
</script>
</body>
</html>
