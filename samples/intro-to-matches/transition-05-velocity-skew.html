<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro→Matches 05 — Velocity Skew</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
<style>.font-serif{font-family:'Cormorant Garamond',serif}</style>
</head>
<body class="bg-[#0c0205] overflow-x-hidden antialiased">
<div class="fixed top-0 inset-x-0 z-50 bg-black/60 backdrop-blur border-b border-white/10">
  <div class="max-w-[1600px] mx-auto px-6 h-[48px] flex items-center justify-between text-[11px] tracking-[0.16em] uppercase text-white/50">05 — Velocity Skew <b class="text-[#e3c877]">LENIS VELOCITY</b><span class="hidden md:inline text-white/30">Fast scroll skew</span></div>
</div>
<section id="intro-vel" class="relative py-16 lg:py-24 flex flex-col justify-center overflow-hidden" style="background: linear-gradient(135deg, #3a0c15 0%, #6e2a2a 48%, #f6e6b4 100%); min-height:86vh;">
  <div id="intro-vel-content" class="relative max-w-[1600px] mx-auto px-6 lg:px-10 grid lg:grid-cols-12 gap-8 items-center w-full will-change-transform" style="will-change:transform">
    <div class="lg:col-span-5"><div class="aspect-[4/5] bg-white/10 border border-white/15"></div></div>
    <div class="lg:col-span-6 lg:col-start-7"><h2 class="font-serif text-[44px] font-light text-[#3a0c15]">Your Best Life</h2><p class="mt-2 text-xs tracking-widest uppercase text-[#3a0c15]/50">Velocity-driven — try fast scroll</p></div>
  </div>
</section>
<section id="matches-vel" class="relative min-h-screen flex flex-col justify-center py-16 overflow-hidden" style="background: linear-gradient(135deg, #3a0c15 0%, #8a4a2f 64%, #f6e6b4 100%); margin-top:-40px; border-top-left-radius:40px; border-top-right-radius:40px;">
  <div class="max-w-6xl mx-auto px-6 w-full"><h2 class="font-serif text-[38px] font-bold">Meet Profiles That Could Be<br><span class="bg-gradient-to-r from-[#f6e6b4] to-[#dcb04a] bg-clip-text text-transparent italic">Your Perfect Match.</span></h2></div>
</section>
<div class="h-[60vh] bg-[#FFFBF0] grid place-items-center text-[#3a0c15]/30 text-xs tracking-widest uppercase">Velocity ends</div>
<script>
gsap.registerPlugin(ScrollTrigger);
const lenis=new Lenis({duration:1.2, lerp:0.1, smoothWheel:true, easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))});
lenis.on('scroll', ScrollTrigger.update); function raf(t){lenis.raf(t); requestAnimationFrame(raf);} requestAnimationFrame(raf);
let skewTarget=0, skewCurrent=0;
lenis.on('scroll', e=>{ skewTarget=Math.max(-6,Math.min(6, e.velocity*0.04)); });
(function skew(){ skewCurrent+=(skewTarget - skewCurrent)*0.12; document.getElementById('intro-vel-content').style.transform=`translate3d(0,0,0) skewY(${skewCurrent}deg)`; skewTarget*=0.96; requestAnimationFrame(skew); })();
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  gsap.to("#intro-vel-content",{ y:-50, opacity:0, scrollTrigger:{trigger:"#intro-vel", start:"top top", end:"60% top", scrub:0.8 }});
}
</script>
</body>
</html>
